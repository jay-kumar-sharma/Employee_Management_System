server:
  port: 8080
spring:
  application:
    name: api-gateway
    
  cloud:
    gateway:
       default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
       globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedHeaders: "*"
            allowedMethods: "*"
            
       routes:    
       - id: AUTH-SERVICE
         uri: lb://AUTH-SERVICE
         predicates:
         - Path=/auth/**

       - id: EMPLOYEE-SERVICE
         uri: lb://EMPLOYEE-SERVICE
         predicates:
         - Path=/employees/**
         
       - id: ATTENDANCE-SERVICE
         uri: lb://ATTENDANCE-SERVICE
         predicates:
         - Path=/attendance/**

       - id: PAYROLL-SERVICE
         uri: lb://PAYROLL-SERVICE
         predicates:
           - Path=/payroll/**



springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: api-gateway
        url: /v3/api-docs
       
      - name: EMPLOYEE-SERVICE
        url: /employees/v3/api-docs
              
      - name: ATTENDANCE-SERVICE
        url: /attendance/v3/api-docs
        
      - name: PAYROLL-SERVICE
        url: /payroll/v3/api-docs

      - name: AUTH-SERVICE
        url: /auth/v3/api-docs
         
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

jwt:
  secret: THIS_IS_A_SUPER_SECRET_KEY_123456